    // 인증 게이트 (Phase 0~1: 클라이언트 측 SHA-256, 24시간 유지)
    // 비밀번호 변경: PowerShell에서 새 SHA-256 해시 계산 후 STORED_HASH 교체
    //   $pw = "새비번"
    //   ([BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($pw))) -replace '-','').ToLower()
    // ============================================================

    const STORED_HASH = 'e9e03c6dc2e68c18214e53f65d0d1bc732031f92ab078e0d6c5648ef55369261';
    const AUTH_KEY = 'cssharing-os-auth-v1';
    const AUTH_DURATION_MS = 24 * 60 * 60 * 1000; // 24시간

    async function sha256Hex(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function isAuthed() {
      try {
        const d = JSON.parse(localStorage.getItem(AUTH_KEY) || '{}');
        return d.hash === STORED_HASH && Date.now() < (d.exp || 0);
      } catch { return false; }
    }

    async function tryAuth(input) {
      const h = await sha256Hex(input);
      if (h === STORED_HASH) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({
          hash: h,
          exp: Date.now() + AUTH_DURATION_MS,
        }));
        return true;
      }
      return false;
    }

    function unlockGate() {
      const gate = document.getElementById('auth-gate');
      if (gate) gate.style.display = 'none';
    }

    // 게이트 로직 — 페이지 로드 즉시 체크
    (function setupGate() {
      const onReady = () => {
        if (isAuthed()) {
          unlockGate();
          return;
        }
        const form = document.getElementById('auth-form');
        const errEl = document.getElementById('auth-error');
        const input = document.getElementById('auth-input');
        if (!form) return;
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.add('hidden');
          const ok = await tryAuth(input.value);
          if (ok) {
            unlockGate();
          } else {
            errEl.classList.remove('hidden');
            input.value = '';
            input.focus();
          }
        });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', onReady);
      } else {
        onReady();
      }
    })();

    function router() {
      const hash = location.hash || '#/';
      const content = document.getElementById('content');
      window.scrollTo(0, 0);

      // 네비 활성화
      document.querySelectorAll('.nav-link').forEach(a => {
        a.classList.toggle('nav-active', a.getAttribute('href') === hash);
      });

      if (hash === '#/' || hash === '') {
        content.innerHTML = renderHome();
      } else if (hash === '#/journal') {
        content.innerHTML = renderJournal();
      } else if (hash === '#/tokens') {
        content.innerHTML = renderTokens();
      } else if (hash.startsWith('#/bot/')) {
        const botKey = hash.replace('#/bot/', '');
        if (bots[botKey]) {
          content.innerHTML = renderBot(botKey);
        } else {
          content.innerHTML = renderNotFound();
        }
      } else {
        content.innerHTML = renderNotFound();
      }
    }

        { key: 'content', name: '콘텐츠봇', emoji: '📑', tokens: 0, color: 'bg-blue-500' },
        { key: 'performance', name: '퍼포먼스봇', emoji: '📡', tokens: 0, color: 'bg-emerald-500' },
        { key: 'branding', name: '브랜딩봇', emoji: '🎨', tokens: 0, color: 'bg-pink-500' },
        { key: 'publisher', name: '퍼블리셔봇', emoji: '📤', tokens: 0, color: 'bg-orange-500' },
        { key: 'assistant', name: '비서봇', emoji: '📋', tokens: 0, color: 'bg-cyan-500' },
      ],

      byDay: [
        // 14일 일별 (정적 자리표시자, 0)
        { date: '04-21', tokens: 0 }, { date: '04-22', tokens: 0 },
        { date: '04-23', tokens: 0 }, { date: '04-24', tokens: 0 },
        { date: '04-25', tokens: 0 }, { date: '04-26', tokens: 0 },
        { date: '04-27', tokens: 0 }, { date: '04-28', tokens: 0 },
        { date: '04-29', tokens: 0 }, { date: '04-30', tokens: 0 },
        { date: '05-01', tokens: 0 }, { date: '05-02', tokens: 0 },
        { date: '05-03', tokens: 0 }, { date: '05-04', tokens: 0 },
      ],

      alerts: [
        { level: 'info', text: '아직 측정 시작 전입니다. Phase 1+에 매니저봇 카운트 활성화.' },
      ],

      thresholds: {
        weekly_per_bot: 200000,
        monthly_total: 2000000,
        per_call_warning: 50000,
      },
    };

    function renderTokens() {
      const u = tokenUsage;
      const used = u.thisMonth.used;
      const budget = u.thisMonth.budget;
      const pct = budget > 0 ? Math.min(100, Math.round((used / budget) * 100)) : 0;

      const totalThisWeek = u.byBot.reduce((s, b) => s + b.tokens, 0);
      const maxBot = Math.max(1, ...u.byBot.map(b => b.tokens));

      const barsHtml = u.byBot.map(b => {
        const widthPct = maxBot > 0 ? (b.tokens / maxBot) * 100 : 0;
        return `
          <div class="flex items-center gap-3 text-sm">
            <span class="w-32 flex items-center gap-2"><span>${b.emoji}</span><span>${b.name}</span></span>
            <div class="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full ${b.color} transition-all" style="width: ${widthPct}%"></div>
            </div>
            <span class="w-20 text-right text-xs font-mono">${formatTokens(b.tokens)}</span>
          </div>
        `;
      }).join('');

      const maxDay = Math.max(1, ...u.byDay.map(d => d.tokens));
      const dayBarsHtml = u.byDay.map(d => {
        const heightPct = maxDay > 0 ? (d.tokens / maxDay) * 100 : 0;
        return `
          <div class="flex flex-col items-center justify-end flex-1 h-32 group cursor-default">
            <div class="text-xs font-mono text-slate-400 mb-1 opacity-0 group-hover:opacity-100">${formatTokens(d.tokens)}</div>
            <div class="w-full bg-amber-200 rounded-t transition-all" style="height: ${Math.max(2, heightPct)}%"></div>
            <div class="text-[10px] text-slate-500 mt-1">${d.date.slice(3)}</div>
          </div>
        `;
      }).join('');

      const alertsHtml = u.alerts.length > 0 ? u.alerts.map(a => {
        const colorMap = {
          info: 'bg-sky-50 border-sky-200 text-sky-800',
          warning: 'bg-amber-50 border-amber-200 text-amber-800',
          danger: 'bg-rose-50 border-rose-200 text-rose-800',
        };
        const iconMap = { info: 'ℹ️', warning: '⚠️', danger: '🚨' };
        return `
          <div class="flex items-start gap-3 p-3 rounded-lg border ${colorMap[a.level] || colorMap.info}">
            <span>${iconMap[a.level] || 'ℹ️'}</span>
            <span class="text-sm">${a.text}</span>
          </div>
        `;
      }).join('') : '<div class="text-sm text-slate-500">알람 없음</div>';

      const sourceLabel = {
        placeholder: '⚪ 자리표시자 (실측정 X)',
        manager_count: '🟡 매니저봇 자체 카운트',
        admin_api: '🟢 Anthropic Admin API',
      }[u.source] || u.source;

      return `
        <section>
          <a href="#/" class="text-xs text-sky-600 hover:underline">← 홈</a>
          <div class="mt-3 flex items-end justify-between flex-wrap gap-3 mb-6">
            <div>
              <h1 class="text-2xl font-bold flex items-center gap-2"><span>🔥</span> 토큰 사용량 (Token Usage)</h1>
              <p class="text-sm text-slate-600 mt-1">봇별·일별 토큰 소비 모니터링. 헌법 토큰 효율 KPI 추적용.</p>
            </div>
            <div class="text-xs text-slate-500 text-right">
              <div>출처: ${sourceLabel}</div>
              <div>갱신: ${u.lastUpdated}</div>
            </div>
          </div>
        </section>

        <!-- 이번달 한눈에 -->
        <section class="bg-white rounded-2xl card-shadow p-6 border border-warm">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><span>📊</span> 이번달 한눈에</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div class="text-center p-4 bg-amber-50 rounded-xl">
              <div class="text-3xl font-bold text-amber-700">${formatTokens(used)}</div>
              <div class="text-xs text-slate-600 mt-1">사용</div>
            </div>
            <div class="text-center p-4 bg-emerald-50 rounded-xl">
              <div class="text-3xl font-bold text-emerald-700">${pct}%</div>
              <div class="text-xs text-slate-600 mt-1">예산 사용 (${formatTokens(budget)} 중)</div>
            </div>
            <div class="text-center p-4 bg-sky-50 rounded-xl">
              <div class="text-3xl font-bold text-sky-700">${u.alerts.filter(a => a.level !== 'info').length}</div>
              <div class="text-xs text-slate-600 mt-1">활성 알람</div>
            </div>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-amber-400 transition-all" style="width: ${pct}%"></div>
          </div>
          <div class="text-xs text-slate-500 mt-3">${u.thisMonth.rateNote}</div>
        </section>

        <!-- 봇별 (이번주) -->
        <section class="bg-white rounded-2xl card-shadow p-6 border border-warm">
          <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <h2 class="text-lg font-semibold flex items-center gap-2"><span>👥</span> 봇별 사용량 (이번주)</h2>
            <span class="text-xs text-slate-500">합계: ${formatTokens(totalThisWeek)}</span>
          </div>
          <div class="space-y-3">${barsHtml}</div>
        </section>

        <!-- 일별 추이 (14일) -->
        <section class="bg-white rounded-2xl card-shadow p-6 border border-warm">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><span>📈</span> 일별 추이 (지난 14일)</h2>
          <div class="flex items-end gap-1 h-40">${dayBarsHtml}</div>
          <div class="text-xs text-slate-500 mt-3">막대 위에 마우스 올리면 정확한 값 표시. 0인 날은 매니저봇 미가동.</div>
        </section>

        <!-- 임계값·알람 -->
        <section class="bg-white rounded-2xl card-shadow p-6 border border-warm">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><span>🚨</span> 임계값·알람</h2>
          <div class="grid md:grid-cols-3 gap-3 mb-4">
            <div class="p-3 bg-slate-50 rounded-lg">
              <div class="text-xs text-slate-500">봇별 주간 임계</div>
              <div class="text-lg font-bold mt-1">${formatTokens(u.thresholds.weekly_per_bot)}</div>
            </div>
            <div class="p-3 bg-slate-50 rounded-lg">
              <div class="text-xs text-slate-500">월간 합계 예산</div>
              <div class="text-lg font-bold mt-1">${formatTokens(u.thresholds.monthly_total)}</div>
            </div>
            <div class="p-3 bg-slate-50 rounded-lg">
              <div class="text-xs text-slate-500">단일 호출 경고</div>
              <div class="text-lg font-bold mt-1">${formatTokens(u.thresholds.per_call_warning)}</div>
            </div>
          </div>
          <div class="space-y-2">${alertsHtml}</div>
        </section>

        <!-- 측정 방식 로드맵 -->
        <section class="bg-amber-50 rounded-2xl p-5 border border-warm">
          <h3 class="font-semibold mb-3 flex items-center gap-2"><span>🔮</span> 측정 방식 로드맵</h3>
          <ul class="space-y-2 text-sm text-slate-700">
            <li class="flex items-start gap-2"><span class="text-slate-500 mt-0.5">⚪</span><div><b>Phase 0~1 (지금)</b>: 자리표시자만, 실 측정 X</div></li>
            <li class="flex items-start gap-2"><span class="text-amber-600 mt-0.5">🟡</span><div><b>Phase 1+</b>: 매니저봇이 호출마다 토큰 메타 기록 → <code>logs/usage/YYYY-MM-DD.json</code></div></li>
            <li class="flex items-start gap-2"><span class="text-emerald-600 mt-0.5">🟢</span><div><b>Phase 2+</b>: Anthropic Admin API 연동 또는 사용자 시트 직접 입력 (정확)</div></li>
            <li class="flex items-start gap-2"><span class="text-sky-600 mt-0.5">🔵</span><div><b>Phase 5+</b>: 봇별 임계값·자동 알람·예산 초과 시 매니저봇 일시 정지</div></li>
          </ul>
          <div class="mt-4 pt-4 border-t border-warm text-xs text-slate-600">
            <b>헌법 7대 규율 #1</b>: 토큰 효율 = 핵심 KPI. 이 페이지는 그 추적 도구.
          </div>
        </section>
      `;
    }

    function formatTokens(n) {
      if (n === 0) return '0';
      if (n < 1000) return n.toString();
      if (n < 1000000) return (n / 1000).toFixed(1) + 'K';
      return (n / 1000000).toFixed(2) + 'M';
    }

    function renderNotFound() {
      return `
        <div class="bg-white rounded-2xl card-shadow p-12 border border-warm text-center">
          <div class="text-6xl mb-4">🤔</div>
          <h2 class="text-xl font-semibold mb-2">방을 찾지 못했어요</h2>
          <p class="text-sm text-slate-600 mb-4">잘못된 경로이거나 아직 입주 안 한 봇입니다.</p>
          <a href="#/" class="text-sm text-sky-600 hover:underline">← 홈으로</a>
        </div>
      `;
    }

    // ============================================================
    // 초기화
    // ============================================================

    window.addEventListener('hashchange', router);
    window.addEventListener('load', () => {
      router();
      document.getElementById('lastUpdated').textContent = '갱신: ' + new Date().toLocaleString('ko-KR');
    });
  </script>
</body>
</html>
